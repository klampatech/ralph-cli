name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go test (unit)
        run: go test ./...

      - name: go test (integration)
        run: go test -tags=integration ./...

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o ralph ./cmd/ralph

      - name: ralph --version
        run: ./ralph --version
